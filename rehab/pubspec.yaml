name: rehab
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  any_image_view: ^2.1.0
  bloc: ^9.2.0
  crystal_navigation_bar: ^1.1.0
  cupertino_icons: ^1.0.9
  curved_navigation_bar: ^1.0.6
  device_info_plus: ^11.5.0
  dio: ^5.9.2
  easy_localization: ^3.0.8
  envied: ^1.3.4
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_chat_types: ^3.6.2
  flutter_chat_ui: ^1.6.9
  flutter_dotenv: ^6.0.1
  flutter_hooks: ^0.21.3+1
  flutter_secure_storage: ^10.0.0
  flutter_slidable: ^4.0.3
  flutter_supabase_chat_core: ^1.6.2
  freezed_annotation: ^3.1.0
  gap: ^3.0.1
  geolocator: ^14.0.2
  get_it: ^9.2.1
  get_storage: ^2.1.1
  go_router: ^17.2.3
  google_fonts: ^8.1.0
  google_sign_in: ^7.2.0
  image_picker: ^1.2.2
  injectable: ^3.0.0
  json_annotation: ^4.11.0
  liquid_progress_indicator_v2: ^0.5.0
  loading_animation_widget: ^1.3.0
  moyasar: ^3.0.1
  multiple_result: ^5.3.0
  package_info_plus: ^9.0.1
  pinput: ^6.0.2
  sizer: ^3.1.3
  supabase_flutter: ^2.12.4
  url_launcher: ^6.3.2
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.5
  injectable_generator: ^3.0.2
  json_serializable: ^6.13.2
  envied_generator: ^1.3.4
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_logo.jpg"
  web:
    generate: true
    image_path: "assets/icons/app_logo.jpg"
  windows:
    generate: true
    image_path: "assets/icons/app_logo.jpg"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icons/app_logo.jpg"

flutter:
  assets:
    - assets/icons/
    - assets/images/
    - assets/translations/
    - .env
  uses-material-design: true
