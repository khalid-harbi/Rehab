include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    # freezed يضع @JsonSerializable على المصنع لا على الصنف، فيشتكي المحلّل
    # من ثمانية نماذج بلا خطأ حقيقي. هذا التجاهل هو ما توصي به وثائق freezed.
    invalid_annotation_target: ignore
